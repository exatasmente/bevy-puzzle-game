[package]
authors = ["corbamico <corbamico@163.com>"]
edition = "2021"
name = "bevy-tetris"
version = "0.9.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# `wav` is not in Bevy's default feature set (which covers Ogg only), and the
# sounds in assets/sfx are WAV — see tools/make_sounds.py for why.
#
# `x11` and `wayland` are not defaults either, and without at least one of them
# a Linux build compiles and then has no windowing backend to open a window
# with. Both are on so one binary covers both session types.
bevy = { version = "0.19", features = ["wav", "x11", "wayland"] }
rand = "0.9"
bevy_prototype_lyon = "0.17"

# Browser-only. Used for localStorage, which is where best scores persist for
# the build people actually play (GitHub Pages). Native builds keep bests in
# memory for the session and never pull this in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Never named in `src/`, and not removable for that reason: both exist only to
# turn on a feature a transitive dependency needs to build for the browser at
# all. Dropping them fails the wasm build with "specify a source of randomness"
# — measured, not assumed.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 's'

