[package]
authors = ["corbamico <corbamico@163.com>"]
edition = "2021"
name = "bevy-tetris"
version = "0.9.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.10"
bevy_utils = "0.10"
lazy_static = "1.4"
rand = "0.8"
bevy_rapier2d  ="0.21"
bevy_prototype_lyon = "0.8.0"
bevy-inspector-egui = "0.18"
wasm-bindgen = "0.2.88"

# Browser-only. Used for localStorage, which is where best scores persist for
# the build people actually play (GitHub Pages). Native builds keep bests in
# memory for the session and never pull this in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 's'

