[package]
authors = ["corbamico <corbamico@163.com>"]
edition = "2021"
name = "bevy-tetris"
version = "0.9.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# `wav` is not in Bevy's default feature set (which covers Ogg only), and the
# sounds in assets/sfx are WAV — see tools/make_sounds.py for why.
#
# `x11` and `wayland` are not defaults either, and without at least one of them
# a Linux build compiles and then has no windowing backend to open a window
# with. Both are on so one binary covers both session types.
bevy = { version = "0.19", features = ["wav", "x11", "wayland"] }
rand = "0.9"
bevy_prototype_lyon = "0.17"

# Browser-only. Used for localStorage, which is where best scores persist for
# the build people actually play (GitHub Pages). Native builds keep bests in
# memory for the session and never pull this in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Never named in `src/`, and not removable for that reason: these exist only to
# turn on features a transitive dependency needs to build for the browser at
# all. Dropping them fails the wasm build — measured, not assumed.
#
# There are three getrandom majors in the tree, reached by different
# dependencies, and each wants its browser backend asked for differently. All
# three have to be answered or the build stops at whichever one it reaches
# first, so they are all declared here under renamed keys:
#
#   0.2 — feature `js`
#   0.3 — feature `wasm_js` AND `--cfg getrandom_backend="wasm_js"`, which is
#         in `.cargo/config.toml`; the feature alone is explicitly not enough
#         and says so in a compile_error
#   0.4 — feature `wasm_js` alone; the cfg was dropped again
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 's'

