<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8" />
    <title>Color Puzzle</title>
    <!-- Inline, so the page stops asking for a /favicon.ico that is not there. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0c16'/%3E%3Crect x='4' y='4' width='11' height='11' fill='%23a855f7'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%234ade80'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23a3c614'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23ec4899'/%3E%3C/svg%3E"
    />
    <style>
      /* The page ground matches the game's own, so the canvas does not sit on
         a contrasting page while it loads. */
      body {
        background: #0e0c16;
        padding: 0;
        margin: 0;
      }
      canvas {
        background-color: #0e0c16;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
  <!--
    Wake the audio up on the first tap.

    Chrome will not let a page start an AudioContext before the user has
    interacted with it: one built earlier comes out `suspended` and stays that
    way until something calls `resume()` inside a gesture. Bevy 0.10 builds its
    context at startup, from cpal, and never calls resume — so without this the
    game fetches its sounds and plays none of them, silently, with only a
    console warning to show for it. Measured, not assumed: the context was still
    `suspended` after two real clicks.

    Nothing in the Rust code can reach that context, so it is caught here
    instead. This script must run *before* the module below, because it works by
    wrapping the constructor and Bevy builds its context during `init()`.
  -->
  <script>
    (function () {
      const contexts = []
      const wrap = (Base) =>
        Base &&
        new Proxy(Base, {
          construct(target, args) {
            const context = new target(...args)
            contexts.push(context)
            return context
          },
        })

      window.AudioContext = wrap(window.AudioContext)
      window.webkitAudioContext = wrap(window.webkitAudioContext)

      const resume = () => {
        for (const context of contexts) {
          if (context.state === 'suspended') context.resume()
        }
      }

      // Capture phase, and on `window`: winit binds the canvas and stops the
      // event there, so a listener waiting for it to bubble never runs. Capture
      // sees it on the way down instead.
      //
      // Every gesture, not just the first: a context can be suspended again by
      // the browser when the tab is hidden, and the player coming back should
      // not have to reload to get the sound back.
      for (const event of ['pointerdown', 'touchstart', 'mousedown', 'keydown']) {
        window.addEventListener(event, resume, { capture: true })
      }

      window.__audioShim = { contexts, resume }
    })()
  </script>
  <script type="module">
    import init from './puzzle_wasm.js'
    init()
  </script>
</html>
